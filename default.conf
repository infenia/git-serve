server {
    listen 80;
    server_name _;
    
    root /var/www/html;
    index index.json;
    
    # Set JSON content type for all responses
    location ~* \.(json)$ {
        add_header Content-Type application/json;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # CORS headers for JSON API
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        return 200;
    }
    
    # Try to serve request as file, then directory, then with .json extension
    location / {
        # First try exact file
        try_files $uri $uri/ @json_fallback;
        
        # Set JSON content type for .json files
        location ~* \.json$ {
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }
    }
    
    # Fallback to add .json extension
    location @json_fallback {
        # Check if file exists with .json extension
        try_files $uri.json =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
    
    # Health check endpoint
    location /health {
        try_files $uri $uri.json =404;
    }
    
    # Specific routes for your API endpoints
    location ~ ^/(age|caste|country|designation|im-signing-up-for|indian-state-district|indian-state|location|qualification|religion|sub-caste)$ {
        try_files $uri $uri.json =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
    
    # Postalcode endpoints (with subdirectories)
    location ~ ^/postalcode/ {
        try_files $uri $uri.json =404;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Logging for debugging
    error_log /var/log/nginx/error.log debug;
    access_log /var/log/nginx/access.log;
}